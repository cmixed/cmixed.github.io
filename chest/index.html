<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <script>
        var t = localStorage.getItem('theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
        else if (!window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'light');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="cmixed 的资源宝箱 - 工具、文档与代码资源下载">
    <meta name="color-scheme" content="dark light">
    <meta property="og:title" content="资源宝箱 · cmixed">
    <meta property="og:description" content="实用工具、文档与代码资源">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cmixed.github.io/chest/">
    <meta property="og:image" content="https://cmixed.github.io/og-image.svg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="cmixed 资源宝箱">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="资源宝箱 · cmixed">
    <meta name="twitter:description" content="实用工具、文档与代码资源">
    <link rel="icon" type="image/png" sizes="32x32" href="../cm-32x32.png">
    <link rel="icon" type="image/png" href="../cm-192x192.png">
    <link rel="apple-touch-icon" href="../cm-192x192.png">
    <link rel="stylesheet" href="style.css">
    <title>资源宝箱 · cmixed</title>
    <style>
        body { padding-top: 0; transition: background 0.3s, color 0.3s; min-height: 100vh; min-height: 100dvh; }

        .scroll-progress {
            position: fixed; top: 0; left: 0; height: 2px; width: 100%;
            background: var(--primary); z-index: 200;
            transform-origin: left; transform: scaleX(0);
            will-change: transform; transition: transform 0.1s linear, background var(--transition-speed);
        }

        .chest-nav {
            position: sticky; top: 0; width: 100%; padding: 1rem 2rem;
            background: rgba(var(--bg-rgb), 0.9); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border); z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
        }
        .chest-nav-left { display: flex; align-items: center; gap: 1.5rem; }
        .chest-nav a { color: var(--text-dim); text-decoration: none; font-size: 0.9rem; transition: color 0.3s; }
        .chest-nav a:hover { color: var(--primary); }
        .chest-nav-logo { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--primary); }
        .chest-nav-title { font-weight: 600; font-size: 0.95rem; color: var(--text); }
        .chest-nav-right { display: flex; align-items: center; gap: 1rem; }

        .chest-filter {
            padding: 0.3rem 0.8rem; background: var(--bg-secondary);
            border: 1px solid var(--border); border-radius: 6px;
            color: var(--text-dim); font-size: 0.8rem; cursor: pointer;
            transition: background 0.3s, border-color 0.3s, color 0.3s;
            text-decoration: none; display: inline-block;
        }
        .chest-filter:hover, .chest-filter.active { background: var(--primary-dim); border-color: var(--primary); color: var(--primary); }

        .chest-page { max-width: 800px; margin: 0 auto; padding: 3rem 2rem; }
        .chest-page h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; }
        .chest-page-sub { color: var(--text-dim); margin-bottom: 2.5rem; }
        .chest-filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 2rem; }
        .chest-grid { display: grid; gap: 1.25rem; grid-template-columns: 1fr; }

        .chest-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
            padding: 1.5rem; position: relative;
            transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 20px var(--shadow);
            content-visibility: auto; contain-intrinsic-size: auto 200px;
        }
        .chest-card.fade-in-item { opacity: 0; transform: translateY(12px); }
        .chest-card.fade-in-item.visible { opacity: 1; transform: translateY(0); }
        .chest-card::before {
            content: ''; position: absolute; top: 0; left: 0;
            width: 100%; height: 3px; background: var(--primary);
            transform: scaleX(0); transform-origin: left; transition: transform 0.3s;
        }
        .chest-card:hover { border-color: var(--primary); transform: translateY(-4px); box-shadow: 0 12px 40px var(--shadow); }
        .chest-card:hover::before { transform: scaleX(1); }

        .chest-card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 0.75rem; }
        .chest-card-title { font-weight: 700; font-size: 1.1rem; color: var(--text); }
        .chest-card-category {
            display: inline-flex; align-items: center; gap: 0.3rem;
            padding: 0.2rem 0.6rem; background: var(--primary-dim);
            color: var(--primary); border-radius: 4px; font-size: 0.75rem; font-weight: 600;
            white-space: nowrap;
        }
        .chest-card-desc { color: var(--text-dim); font-size: 0.85rem; line-height: 1.6; margin-bottom: 1rem; }
        .chest-card-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .chest-card-tags span {
            font-size: 0.7rem; padding: 0.15rem 0.45rem;
            border: 1px solid var(--border); border-radius: 3px;
            color: var(--text-muted); background: var(--bg-secondary);
        }
        .chest-card-meta { display: flex; justify-content: space-between; align-items: center; }
        .chest-card-info { font-size: 0.8rem; color: var(--text-muted); }
        .chest-download {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.5rem 1rem; background: var(--primary); color: #fff;
            border: none; border-radius: 6px; font-size: 0.8rem; font-weight: 500;
            text-decoration: none; transition: background 0.3s, transform 0.3s, color 0.3s;
        }
        .chest-download:hover { background: transparent; color: var(--primary); transform: translateY(-1px); }

        .chest-empty { text-align: center; padding: 4rem 2rem; color: var(--text-dim); }
        .chest-empty-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }

        @media (max-width: 768px) {
            .chest-page { padding: 2rem 1.25rem; }
            .chest-page h1 { font-size: 1.4rem; }
            .chest-card { padding: 1.25rem; }
        }
        @media (max-width: 480px) {
            .chest-page { padding: 1.5rem 1rem; }
            .chest-page h1 { font-size: 1.25rem; }
            .chest-page-sub { font-size: 0.85rem; }
            .chest-card-title { font-size: 1rem; }
            .chest-card-desc { font-size: 0.8rem; }
            .chest-nav { padding: 0.75rem 1rem; }
        }
        @media (max-width: 360px) {
            .chest-page h1 { font-size: 1.15rem; }
            .chest-card-title { font-size: 0.95rem; }
            .chest-nav-logo { font-size: 1rem; }
        }
        @media (min-width: 1024px) {
            .chest-page { max-width: 1000px; }
            .chest-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (min-width: 1280px) { .chest-page { max-width: 1120px; } }
        @media (min-width: 1536px) { .chest-page { max-width: 1280px; } }
        @media (min-width: 1920px) {
            .chest-page { max-width: 1400px; padding: 4rem 3rem; }
            .chest-card { padding: 2rem; }
            .chest-card-title { font-size: 1.2rem; }
        }
        @media (min-width: 2560px) {
            .chest-page { max-width: 1500px; padding: 5rem 4rem; }
            .chest-grid { gap: 1.5rem; }
            .chest-card { padding: 2.5rem; }
            .chest-card-title { font-size: 1.3rem; }
            .chest-card-desc { font-size: 0.95rem; }
        }

        @media (hover: none) and (pointer: coarse) {
            .chest-card:hover { transform: none; }
            .chest-download { min-height: 44px; padding: 0.6rem 1.2rem; }
            .chest-filter { min-height: 44px; padding: 0.5rem 1rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: 0.01ms !important; }
        }
        html.reduce-motion *, html.reduce-motion *::before, html.reduce-motion *::after {
            transition-duration: 0.01ms !important;
        }

        @media print {
            .chest-nav, .chest-filters, .chest-download { display: none !important; }
            body { background: white !important; color: black !important; }
            .chest-card { break-inside: avoid; box-shadow: none; border: 1px solid #ccc; }
        }
    </style>
</head>
<body>
    <div class="scroll-progress" id="scrollProgress"></div>
    <nav class="chest-nav">
        <div class="chest-nav-left">
            <a href="../" class="chest-nav-logo">&larr; cmixed</a>
            <a href="./" class="chest-nav-title">资源宝箱</a>
        </div>
        <div class="chest-nav-right">
            <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
                <div class="theme-toggle-slider">
                    <span class="theme-icon moon-icon">&#9684;</span>
                    <span class="theme-icon sun-icon">&#9685;</span>
                </div>
            </button>
        </div>
    </nav>

    <div class="chest-page">
        <h1>资源宝箱</h1>
        <p class="chest-page-sub">实用工具、文档与代码资源</p>
        <div class="chest-filters">{{filters}}</div>
        <div class="chest-grid">{{resources}}</div>
    </div>

    <script>
        (function() {
            var htmlEl = document.documentElement;
            var saved = localStorage.getItem('theme');
            if (saved) htmlEl.setAttribute('data-theme', saved);
            else if (!window.matchMedia('(prefers-color-scheme: dark)').matches) htmlEl.setAttribute('data-theme', 'light');

            document.getElementById('themeToggle').addEventListener('click', function() {
                var t = htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                htmlEl.setAttribute('data-theme', t);
                localStorage.setItem('theme', t);
            });

            var progressBar = document.getElementById('scrollProgress');
            if (progressBar) {
                window.addEventListener('scroll', function() {
                    var scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
                    var scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                    var progress = scrollHeight > 0 ? scrollTop / scrollHeight : 0;
                    progressBar.style.transform = 'scaleX(' + progress + ')';
                }, { passive: true });
            }

            var cards = Array.from(document.querySelectorAll('.chest-card'));
            var cardCategories = cards.map(function(card) {
                return card.getAttribute('data-category');
            });

            if ('IntersectionObserver' in window) {
                var fadeObserver = new IntersectionObserver(function(entries) {
                    entries.forEach(function(entry) {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                            fadeObserver.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.1 });
                cards.forEach(function(card) {
                    card.classList.add('fade-in-item');
                    fadeObserver.observe(card);
                });
            }

            var params = new URLSearchParams(location.search);
            var activeFilter = params.get('category') || '';
            var allBtn = document.querySelector('.chest-filter[data-category=""]');
            if (allBtn) allBtn.classList.add('active');
            if (activeFilter) {
                document.querySelectorAll('.chest-filter').forEach(function(btn) {
                    btn.classList.remove('active');
                    if (btn.getAttribute('data-category') === activeFilter) btn.classList.add('active');
                });
                cards.forEach(function(card, i) {
                    if (cardCategories[i] !== activeFilter) card.style.display = 'none';
                });
            }
            document.querySelectorAll('.chest-filter').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    var cat = btn.getAttribute('data-category');
                    if (activeFilter === cat) {
                        activeFilter = '';
                        history.pushState(null, '', location.pathname);
                    } else {
                        activeFilter = cat;
                        history.pushState(null, '', '?category=' + encodeURIComponent(cat));
                    }
                    document.querySelectorAll('.chest-filter').forEach(function(b) { b.classList.remove('active'); });
                    if (!activeFilter) {
                        if (allBtn) allBtn.classList.add('active');
                    } else {
                        btn.classList.add('active');
                    }
                    cards.forEach(function(card, i) {
                        card.style.display = (!activeFilter || cardCategories[i] === activeFilter) ? '' : 'none';
                    });
                });
            });
        })();
    </script>
</body>
</html>
