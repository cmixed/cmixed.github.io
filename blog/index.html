<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="cmixed 的技术博客 - C++、Rust、系统编程、AI 应用">
    <meta name="color-scheme" content="dark light">
    <link rel="icon" type="image/svg+xml" href="../assets/icons/blog.svg">
    <link rel="apple-touch-icon" href="../assets/icons/blog-192x192.png">
    <link rel="alternate" type="application/rss+xml" title="cmixed 博客 RSS" href="feed.xml">
    <meta property="og:title" content="个人博客 · cmixed">
    <meta property="og:description" content="cmixed 的技术博客 - C++、Rust、系统编程、AI 应用">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cmixed.github.io/blog/">
    <meta property="og:image" content="https://cmixed.github.io/assets/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="cmixed 博客">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="个人博客 · cmixed">
    <meta name="twitter:description" content="cmixed 的技术博客 - C++、Rust、系统编程、AI 应用">
    <title>个人博客 · cmixed</title>
    <link rel="stylesheet" href="style.css">
    <script src="../theme.js"></script>
    <script defer src="../ui.js"></script>
    <style>
        body { transition: background 0.3s, color 0.3s; }

        /* 头部（标题 / 小字 / 排序）与筛选标签栏的尺寸、材质、间距都在 style.css 的
           「列表页头部」「小标签」两节里，博客与资源小窝共用同一份。 */

        .blog-page { --list-max: 800px; max-width: var(--list-max); margin: 0 auto; padding: 3rem 2rem; }
        /* 同一页的卡片等高：高度由最高的那张决定，短摘要的卡用 min-height 补齐摘要区 */
        .blog-page-list { display: grid; gap: 1.25rem; grid-template-columns: 1fr; grid-auto-rows: 1fr; }
        .blog-page-card {
            /* 底色与 6 层受光图由 style.css 统一给；这里不要写 background 简写 */
            border: 1px solid var(--border); border-radius: 12px;
            /* overflow 必须是 visible：浮窗绝对定位在卡片下方，hidden 会把它裁掉。
               min-width: 0 必须有：标签行是 nowrap，grid 项默认 min-width:auto 会被
               全部标签的总宽顶开，窄屏下整张卡撑破视口。 */
            padding: 1.25rem; position: relative; overflow: visible; min-width: 0;
            transition: background-color var(--transition-speed), border-color 0.3s, transform 0.3s, box-shadow 0.3s, --glare 0.28s ease;
            text-decoration: none; color: inherit;
            /* 纵向 flex：footer 的 margin-top:auto 才能把标签与元信息压到卡片底部，
               同一行的卡片因此底边对齐（和小窝卡片同一套结构） */
            display: flex; flex-direction: column;
        }
        .blog-page-card::before {
            content: ''; position: absolute; inset: 0;
            border-radius: inherit; pointer-events: none;
            /* 顶部高亮不再是一条独立的硬线：改成覆盖整张卡的内嵌光，
               4px accent 带 + 向下淡出的薄雾，沿 12px 圆角裁切，永远在边框内侧。 */
            box-shadow: inset 0 4px 0 0 var(--card-top-band);
            background-image: linear-gradient(180deg, var(--card-top-glow), transparent 96px);
            opacity: 0; transition: opacity 0.3s;
        }
        .blog-page-card:hover::before,
        .blog-page-card:focus-visible::before { opacity: 1; }
        .blog-page-card-pin::before { opacity: 0.55; }
        .blog-page-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--mica-elev-2); }
        /* 卡片内部顺序与小窝列表一致：标题 → 摘要 → 标签 → 元信息。
           之前是标题 → 标签 → 元信息 → 摘要，标签夹在标题和正文之间，
           正文反而沉到卡片最底下，两页放在一起看是两种卡片。 */
        .blog-page-card-title {
            font-weight: 700; font-size: 1.1rem; margin-bottom: 0.75rem;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden;
        }
        /* 摘要固定三行：卡片高度因此不随摘要长短起伏。
           被截掉的部分由浮窗补（只有真的截断时才出现，见 style.css「卡片浮窗」）。 */
        .blog-page-card-desc {
            font-size: 0.85rem; color: var(--text-dim); line-height: 1.6; margin-bottom: 1rem;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: calc(3 * 1.6 * 0.85rem);
        }
        .blog-page-card-footer { margin-top: auto; }
        .blog-page-card-tags { display: flex; gap: 0.4rem; flex-wrap: nowrap; overflow: hidden; margin-bottom: 1rem; min-width: 0; }
        /* 这一行是长句（阅读 / 创建 / 更新 / 字数 / 图片），窄卡里会换行。
           keep-all 禁止在中文词内部断行：否则行尾刚好塞满时会掉一个「片」到下一行；
           分隔点前的空格在构建时写成 \u00a0，所以「·」跟着前一段走，不会顶到行首。 */
        .blog-page-card-meta { font-size: 0.8rem; color: var(--text-muted); word-break: keep-all; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .blog-page-card-pin { border-color: var(--primary-dim); }

        @media (max-width: 768px) {
            .blog-page { padding: 2rem 1.25rem; }
        }
        @media (max-width: 480px) {
            .blog-page { padding: 1.5rem 1rem; }
            .blog-page-card { padding: 1.25rem; }
            .blog-page-card-title { font-size: 1rem; }
            .blog-page-card-desc { font-size: 0.8rem; }
        }
        @media (max-width: 360px) {
            .blog-page-card-title { font-size: 0.95rem; }
        }
        @media (min-width: 1024px) {
            .blog-page { --list-max: 1000px; }
            .blog-page-list { grid-template-columns: repeat(2, 1fr); }
        }
        @media (min-width: 1280px) { .blog-page { --list-max: 1120px; } }
        @media (min-width: 1536px) { .blog-page { --list-max: 1280px; } }
        @media (min-width: 1920px) {
            .blog-page { --list-max: 1400px; padding: 4rem 3rem; }
            .blog-page-card { padding: 2rem; }
            .blog-page-card-title { font-size: 1.2rem; }
        }
        @media (min-width: 2560px) {
            .blog-page { --list-max: 1500px; padding: 5rem 4rem; }
            .blog-page-list { gap: 1.5rem; }
            .blog-page-card { padding: 2.5rem; }
            .blog-page-card-title { font-size: 1.3rem; }
            .blog-page-card-desc { font-size: 0.95rem; }
        }

        @media (hover: none) and (pointer: coarse) {
            .blog-page-card:hover { transform: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: 0.01ms !important; }
        }

        @media print {
            .list-sort, .list-filters { display: none !important; }
            body { background: white !important; color: black !important; }
            .blog-page-card { break-inside: avoid; box-shadow: none; border: 1px solid #ccc; }
        }
    </style>
    <script>
        /* 桌面默认展开筛选栏。放在首帧前加 class，避免页面先按窄版排一遍再跳宽。 */
        (function () {
            try {
                var saved = localStorage.getItem('list-filters-open');
                if (window.matchMedia('(min-width: 1280px)').matches && saved !== 'false') {
                    document.documentElement.classList.add('filters-open');
                }
            } catch (e) { }
        })();
    </script>
</head>
<body>
    <nav class="blog-nav">
        <div class="blog-nav-left">
            <a href="../" class="logo">cmixed &larr;</a>
            <a href="./" class="blog-nav-title blog-nav-active">个人博客</a>
            <a href="../nook/" class="blog-nav-title">资源小窝</a>
        </div>

        <div class="nav-search" id="navSearch" role="search">
            <div class="search-bar">
                {{icon:search:search-icon}}
                <input id="searchInput" class="search-input" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search" placeholder="搜索标题、摘要或标签…" aria-label="搜索文章">
                <button type="button" id="searchClear" class="search-clear" aria-label="清除搜索" hidden>&times;</button>
            </div>
            <button type="button" class="nav-search-cancel" id="searchCancel">取消</button>
        </div>

        <div class="blog-nav-right">
            <a href="feed.xml" title="RSS 订阅" class="blog-nav-rss">{{icon:rss}}</a>
            <button class="fab-btn" id="searchToggle" type="button" title="搜索" aria-label="搜索文章" aria-expanded="false" aria-controls="navSearch">{{icon:search}}</button>
            <button class="fab-btn" id="filterToggle" type="button" title="标签" aria-label="筛选标签" aria-expanded="false" aria-controls="filterPanel">
                {{icon:tag}}
            </button>
            <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
                <div class="theme-toggle-slider">
                    <span class="theme-icon moon-icon">{{icon:moon}}</span>
                    <span class="theme-icon sun-icon">{{icon:sun}}</span>
                </div>
            </button>
        </div>
    </nav>

    <div class="list-filters-overlay" id="filterOverlay"></div>

    <div class="blog-page list-page">
        <div class="list-layout" id="listLayout">
            <div class="list-main">
                <div class="list-head">
                    <h1 class="list-title sr-only">个人博客</h1>
                    <div class="list-meta">
                        <p class="list-sub">技术笔记、工具分享与学习记录</p>
                        <div class="list-sort" role="group" aria-label="排序方式">
                                                        <button type="button" class="list-sort-btn" data-sort="default" aria-pressed="true">默认</button>
                            <button type="button" class="list-sort-btn" data-sort="date" aria-pressed="false">创建时间</button>
                            <button type="button" class="list-sort-btn" data-sort="updated" aria-pressed="false">更新时间</button>
                        </div>
                    </div>
                </div>
                <div class="search-count" id="searchCount" role="status" aria-live="polite" hidden></div>
                <div class="blog-page-list">{{posts}}</div>
                <div class="search-empty" id="searchEmpty" hidden>
                    <div class="search-empty-icon">{{icon:search}}</div>
                    <p>没有找到匹配的文章</p>
                </div>
            </div>

            <aside class="list-filters-panel" id="filterPanel" aria-label="标签筛选">
                <div class="list-filters-head">
                    {{allChip}}
                    <button type="button" class="list-filters-close" id="filterClose" aria-label="关闭筛选">&times;</button>
                </div>
                <div class="list-filters-scroll" id="filterScroll">
                    <div class="list-filters">{{tags}}</div>
                </div>
            </aside>
        </div>
    </div>

    <script src="../list.js"></script>
    <script>
        (function() {
            document.getElementById('themeToggle').addEventListener('click', function() {
                window.toggleTheme();
            });

            var cards = Array.from(document.querySelectorAll('.blog-page-card'));
            var tagsByCard = new Map();
            cards.forEach(function(card) {
                tagsByCard.set(card, Array.from(card.querySelectorAll('.blog-page-card-tags span')).map(function(s) { return s.textContent; }));
            });

            var params = new URLSearchParams(location.search);
            var activeTag = params.get('tag') || '';
            var filterToggle = document.getElementById('filterToggle');

            function applyTagButtons() {
                document.querySelectorAll('.list-chip').forEach(function(btn) {
                    btn.classList.toggle('active', (btn.getAttribute('data-tag') || '') === activeTag);
                });
                if (filterToggle) filterToggle.toggleAttribute('data-filtered', !!activeTag);
            }

            // 只改自己的 URL 参数，保留 ?q= / ?sort= 等其它参数
            function syncUrl() {
                var p = new URLSearchParams(location.search);
                if (activeTag) p.set('tag', activeTag); else p.delete('tag');
                var qs = p.toString();
                history.pushState(null, '', location.pathname + (qs ? '?' + qs : ''));
            }

            var search = window.initListSearch({
                inputId: 'searchInput',
                clearId: 'searchClear',
                countId: 'searchCount',
                emptyId: 'searchEmpty',
                toggleId: 'searchToggle',
                panelId: 'navSearch',
                cancelId: 'searchCancel',
                cardSelector: '.blog-page-card',
                countUnit: '篇文章',
                extraFilter: function(card) {
                    return !activeTag || tagsByCard.get(card).includes(activeTag);
                }
            });

            // Tag filtering（「全部」的 data-tag 是空串，等价于清掉筛选）
            document.querySelectorAll('.list-chip').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    var tag = btn.getAttribute('data-tag') || '';
                    activeTag = activeTag === tag ? '' : tag;
                    applyTagButtons();
                    syncUrl();
                    search.refresh();
                });
            });
            applyTagButtons();

            // 排序（默认 / 创建时间 / 更新时间）由 list.js（search + sort）统一处理，两个列表页共用一份
            window.initListSort({
                list: '.blog-page-list',
                card: '.blog-page-card',
                button: '.list-sort-btn',
                onChange: function() { search.refresh(); }
            });

            // 前进 / 后退：标签由本页同步；排序由 list.js 自己监听
            window.addEventListener('popstate', function() {
                activeTag = new URLSearchParams(location.search).get('tag') || '';
                applyTagButtons();
                search.refresh();
            });

            window.initFilterPanel();
        })();
    </script>
</body>
</html>
