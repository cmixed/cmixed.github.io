<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="cmixed 的技术博客 - C++、Rust、系统编程、AI 应用">
    <meta name="color-scheme" content="dark light">
    <link rel="icon" type="image/png" sizes="32x32" href="../blog-32x32.png">
    <link rel="icon" type="image/png" href="../blog-192x192.png">
    <link rel="apple-touch-icon" href="../blog-192x192.png">
    <link rel="alternate" type="application/rss+xml" title="cmixed 博客 RSS" href="feed.xml">
    <title>博客 · cmixed</title>
    <link rel="stylesheet" href="style.css">
    <script src="../theme.js"></script>
    <style>
        body { padding-top: 0; transition: background 0.3s, color 0.3s; }

        .blog-tag {
            padding: 0.3rem 0.8rem; background: var(--mica-surface);
            border: 1px solid var(--border); border-radius: 6px;
            color: var(--text-dim); font-size: 0.8rem; cursor: pointer;
            transition: background 0.3s, border-color 0.3s, color 0.3s;
            text-decoration: none; display: inline-block;
        }
        .blog-tag:hover, .blog-tag.active { background: var(--primary-dim); border-color: var(--primary); color: var(--primary); }

        .blog-page { max-width: 800px; margin: 0 auto; padding: 3rem 2rem; }
        .blog-page h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; }
        .blog-page-sub { color: var(--text-dim); margin-bottom: 2.5rem; }
        .blog-page-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 2rem; }
        .blog-page-list { display: grid; gap: 1.25rem; grid-template-columns: 1fr; }
        .blog-page-card {
            background: var(--mica-surface); border: 1px solid var(--border); border-radius: 12px;
            padding: 1.5rem; position: relative; overflow: hidden;
            transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
            text-decoration: none; color: inherit; display: block;
        }
        .blog-page-card::before {
            content: ''; position: absolute; top: 0; left: 0;
            width: 100%; height: 2px; background: var(--primary);
            transform: scaleX(0); transform-origin: left; transition: transform 0.3s, height 0.3s;
        }
        .blog-page-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 4px 20px var(--shadow); }
        .blog-page-card:hover::before { transform: scaleX(1); height: 4px; opacity: 1; }
        .blog-page-card-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 0.3rem; }
        .blog-page-card-meta { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.5rem; }
        .blog-page-card-desc { font-size: 0.85rem; color: var(--text-dim); line-height: 1.6; }
        .blog-page-card-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.75rem; }
        .blog-page-card-tags span {
            font-size: 0.7rem; padding: 0.15rem 0.45rem;
            border: 1px solid var(--border); border-radius: 3px; color: var(--text-muted); background: var(--mica-surface);
        }
        .blog-page-card-pin { border-color: var(--primary-dim); }
        .blog-page-card-pin::before { transform: scaleX(1); height: 2px; opacity: 0.3; }
        .blog-sort { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 2rem; font-size: 0.85rem; color: var(--text-dim); }
        .blog-sort-btn {
            padding: 0.3rem 0.8rem; background: var(--mica-surface); border: 1px solid var(--border);
            border-radius: 6px; color: var(--text-dim); font-size: 0.8rem; cursor: pointer;
            transition: background 0.3s, border-color 0.3s, color 0.3s;
        }
        .blog-sort-btn:hover, .blog-sort-btn.active { background: var(--primary-dim); border-color: var(--primary); color: var(--primary); }

        @media (max-width: 768px) {
            .blog-page { padding: 2rem 1.25rem; }
            .blog-page h1 { font-size: 1.4rem; }
        }
        @media (max-width: 480px) {
            .blog-page { padding: 1.5rem 1rem; }
            .blog-page h1 { font-size: 1.25rem; }
            .blog-page-sub { font-size: 0.85rem; }
            .blog-page-card { padding: 1.25rem; }
            .blog-page-card-title { font-size: 1rem; }
            .blog-page-card-desc { font-size: 0.8rem; }
            .blog-nav { padding: 0.75rem 1rem; }
        }
        @media (max-width: 360px) {
            .blog-page h1 { font-size: 1.15rem; }
            .blog-page-card-title { font-size: 0.95rem; }
            .blog-nav-logo { font-size: 1rem; }
        }
        @media (min-width: 1024px) {
            .blog-page { max-width: 1000px; }
            .blog-page-list { grid-template-columns: repeat(2, 1fr); }
        }
        @media (min-width: 1280px) { .blog-page { max-width: 1120px; } }
        @media (min-width: 1536px) { .blog-page { max-width: 1280px; } }
        @media (min-width: 1920px) {
            .blog-page { max-width: 1400px; padding: 4rem 3rem; }
            .blog-page-card { padding: 2rem; }
            .blog-page-card-title { font-size: 1.2rem; }
        }
        @media (min-width: 2560px) {
            .blog-page { max-width: 1500px; padding: 5rem 4rem; }
            .blog-page-list { gap: 1.5rem; }
            .blog-page-card { padding: 2.5rem; }
            .blog-page-card-title { font-size: 1.3rem; }
            .blog-page-card-desc { font-size: 0.95rem; }
        }

        @media (hover: none) and (pointer: coarse) {
            .blog-page-card:hover { transform: none; }
            .blog-tag { min-height: 44px; padding: 0.5rem 1rem; }
            .blog-sort-btn { min-height: 44px; padding: 0.5rem 1rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: 0.01ms !important; }
        }
        html.reduce-motion *, html.reduce-motion *::before, html.reduce-motion *::after {
            transition-duration: 0.01ms !important;
        }

        @media print {
            .blog-nav, .blog-sort, .blog-page-tags { display: none !important; }
            body { background: white !important; color: black !important; }
            .blog-page-card { break-inside: avoid; box-shadow: none; border: 1px solid #ccc; }
        }
    </style>
</head>
<body>
    <nav class="blog-nav">
        <div class="blog-nav-left">
            <a href="../" class="logo blog-nav-logo">&larr; cmixed</a>
            <a href="./" class="blog-nav-title blog-nav-active">博客</a>
            <a href="../nook/" class="blog-nav-title">资源小窝</a>
        </div>
        <div class="blog-nav-right">
            <a href="feed.xml" title="RSS 订阅" class="blog-nav-rss">&#9741;</a>
            <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
                <div class="theme-toggle-slider">
                    <span class="theme-icon moon-icon">&#9684;</span>
                    <span class="theme-icon sun-icon">&#9685;</span>
                </div>
            </button>
        </div>
    </nav>

    <div class="blog-page">
        <h1>博客</h1>
        <p class="blog-page-sub">技术笔记、工具分享与学习记录</p>
        <div class="search-bar">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input id="searchInput" class="search-input" type="search" autocomplete="off" spellcheck="false" placeholder="搜索标题、摘要或标签…" aria-label="搜索文章">
            <button type="button" id="searchClear" class="search-clear" aria-label="清除搜索" hidden>&times;</button>
        </div>
        <p class="search-count" id="searchCount" role="status" aria-live="polite" hidden></p>
        <div class="blog-page-tags">{{tags}}</div>
        <div class="blog-sort">
            <span>排序：</span>
            <button class="blog-sort-btn active" data-sort="default">默认</button>
            <button class="blog-sort-btn" data-sort="date">创建时间</button>
            <button class="blog-sort-btn" data-sort="updated">更新时间</button>
        </div>
        <div class="blog-page-list">{{posts}}</div>
        <div class="search-empty" id="searchEmpty" hidden>
            <div class="search-empty-icon">&#128269;</div>
            <p>没有找到匹配的文章</p>
        </div>
    </div>

    <script src="../search.js"></script>
    <script>
        (function() {
            document.getElementById('themeToggle').addEventListener('click', function() {
                window.toggleTheme();
            });

            var cards = Array.from(document.querySelectorAll('.blog-page-card'));
            var tagsByCard = new Map();
            cards.forEach(function(card) {
                tagsByCard.set(card, Array.from(card.querySelectorAll('.blog-page-card-tags span')).map(function(s) { return s.textContent; }));
            });

            var grid = document.querySelector('.blog-page-list');
            var originalCards = cards.slice();
            var params = new URLSearchParams(location.search);
            var activeTag = params.get('tag') || '';

            function applyTagButtons() {
                document.querySelectorAll('.blog-tag').forEach(function(btn) {
                    btn.classList.toggle('active', !!activeTag && btn.textContent === activeTag);
                });
            }

            // 只改自己的 URL 参数，保留 ?q= 等其它参数
            function syncUrl() {
                var p = new URLSearchParams(location.search);
                if (activeTag) p.set('tag', activeTag); else p.delete('tag');
                var qs = p.toString();
                history.pushState(null, '', location.pathname + (qs ? '?' + qs : ''));
            }

            var search = window.initListSearch({
                inputId: 'searchInput',
                clearId: 'searchClear',
                countId: 'searchCount',
                emptyId: 'searchEmpty',
                cardSelector: '.blog-page-card',
                countUnit: '篇文章',
                extraFilter: function(card) {
                    return !activeTag || tagsByCard.get(card).includes(activeTag);
                }
            });

            // Tag filtering
            document.querySelectorAll('.blog-tag').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    var tag = btn.textContent;
                    activeTag = activeTag === tag ? '' : tag;
                    applyTagButtons();
                    syncUrl();
                    search.refresh();
                });
            });
            applyTagButtons();

            // Sorting
            function sortCards(sortBy) {
                var sorted = sortBy === 'default' ? originalCards.slice() : cards.slice();
                if (sortBy !== 'default') {
                    sorted.sort(function(a, b) {
                        return b.getAttribute('data-' + sortBy).localeCompare(a.getAttribute('data-' + sortBy));
                    });
                }
                sorted.forEach(function(card) { grid.appendChild(card); });
                document.querySelectorAll('.blog-sort-btn').forEach(function(btn) {
                    btn.classList.toggle('active', btn.getAttribute('data-sort') === sortBy);
                });
                search.refresh();
            }
            document.querySelectorAll('.blog-sort-btn').forEach(function(btn) {
                btn.addEventListener('click', function() { sortCards(btn.getAttribute('data-sort')); });
            });

            // Respect URL param for sort
            var sortParam = params.get('sort');
            sortCards(sortParam === 'updated' || sortParam === 'date' || sortParam === 'default' ? sortParam : 'default');

            // 前进 / 后退：同步标签与排序
            window.addEventListener('popstate', function() {
                var p = new URLSearchParams(location.search);
                activeTag = p.get('tag') || '';
                applyTagButtons();
                var s = p.get('sort');
                sortCards(s === 'updated' || s === 'date' || s === 'default' ? s : 'default');
            });
        })();
    </script>
</body>
</html>
