<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{description}}">
    <meta property="og:title" content="{{title}} · cmixed">
    <meta property="og:description" content="{{description}}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://cmixed.github.io/blog/{{slug}}.html">
    <meta property="og:site_name" content="cmixed 博客">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{title}} · cmixed">
    <meta name="twitter:description" content="{{description}}">
    <title>{{title}} · cmixed</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../cm-32x32.png">
    <link rel="icon" type="image/png" href="../cm-192x192.png">
    <link rel="apple-touch-icon" href="../cm-192x192.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" id="hljs-theme" media="print" onload="this.media='all'">
    <style>
        body { padding-top: 0; transition: background 0.3s, color 0.3s; }

        /* Nav — matches blog index */
        .blog-nav {
            position: sticky; top: 0; width: 100%; padding: 1rem 2rem;
            background: rgba(var(--bg-rgb), 0.9); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border); z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
        }
        .blog-nav-left { display: flex; align-items: center; gap: 1.5rem; }
        .blog-nav a { color: var(--text-dim); text-decoration: none; font-size: 0.9rem; transition: color 0.3s; }
        .blog-nav a:hover { color: var(--primary); }

        /* Sidebar TOC */
        .blog-article-layout { display: grid; grid-template-columns: 1fr; gap: 2rem; max-width: 1100px; margin: 0 auto; padding: 3rem 2rem; }
        .blog-toc { display: none; position: sticky; top: 80px; align-self: start; max-height: calc(100vh - 100px); overflow-y: auto; padding-right: 1rem; }
        body.toc-open .blog-toc { display: block; }
        body.toc-open .blog-article-layout { grid-template-columns: 200px 1fr; }
        .blog-toc-title { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.75rem; }

        /* TOC item — flex row: arrow/spacer + link */
        .toc-item { display: flex; align-items: center; padding: 0.2rem 0; }
        .toc-item a {
            flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
            font-size: 0.8rem; color: var(--text-dim); text-decoration: none;
            border-left: 2px solid transparent; padding: 0.2rem 0.5rem; line-height: 1.4;
            transition: color 0.2s, border-color 0.2s;
        }
        .toc-item a:hover { color: var(--primary); border-left-color: var(--primary); }
        .toc-item a.active { color: var(--primary); border-left-color: var(--primary); font-weight: 600; }

        /* Arrow (collapsible) & spacer (non-collapsible) */
        .toc-arrow, .toc-spacer { width: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .toc-arrow { cursor: pointer; opacity: 0.5; transition: opacity 0.2s, transform 0.2s; }
        .toc-arrow:hover { opacity: 1; }
        .toc-arrow::after { content: ''; width: 0; height: 0; border-left: 4px solid currentColor; border-top: 3px solid transparent; border-bottom: 3px solid transparent; }
        .toc-group.collapsed > .toc-item > .toc-arrow { transform: rotate(90deg); }

        /* Level-specific styling */
        .toc-item[data-level="2"] a { font-weight: 600; }
        .toc-item[data-level="3"] { padding-left: 1rem; }
        .toc-item[data-level="4"] { padding-left: 2rem; }
        .toc-item[data-level="4"] a { font-size: 0.7rem; opacity: 0.85; }
        .toc-item.toc-h1 a { font-weight: 700; font-size: 0.85rem; }
        .toc-item.toc-title span { font-weight: 700; font-size: 0.9rem; color: var(--text); padding: 0.3rem 0.5rem; display: block; }

        /* Group & children — collapsible */
        .toc-group { margin-bottom: 0.25rem; }
        .toc-children { overflow: hidden; transition: max-height 0.3s ease; }
        .toc-group.collapsed > .toc-children { max-height: 0 !important; }

        /* Article content */
        .blog-article { max-width: 100%; min-width: 0; }
        .blog-article-desc {
            color: var(--text-dim); font-size: 0.9rem; line-height: 1.8;
            margin: 1rem 0 1.75rem; padding: 0.6rem 1rem;
            border-left: 3px solid var(--primary); background: var(--primary-dim);
            border-radius: 0 6px 6px 0; font-style: italic;
        }
        .blog-article-meta { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
        .blog-article-tags { margin-bottom: 0.5rem; }
        .blog-article-info { font-size: 0.8rem; }
        .blog-article-content { line-height: 1.9; color: var(--text-dim); }
        .blog-article-content h1 { font-size: 1.6rem; color: var(--text); margin-bottom: 0.5rem; margin-top: 0; }
        .blog-article-content h2 { font-size: 1.3rem; color: var(--text); margin-top: 2.5rem; margin-bottom: 0.75rem; font-weight: 700; scroll-margin-top: 90px; }
        .blog-article-content h3 { font-size: 1.1rem; color: var(--text); margin-top: 2rem; margin-bottom: 0.5rem; font-weight: 600; scroll-margin-top: 90px; }
        .blog-article-content h4 { font-size: 1rem; color: var(--text); margin-top: 1.5rem; margin-bottom: 0.5rem; font-weight: 600; scroll-margin-top: 90px; }
        body.indent .blog-article-content > p:not(:has(> img:only-child)) { text-indent: 2em; }
        body.indent .blog-article-content > p:first-child { text-indent: 0; }
        .blog-article-content h5, .blog-article-content h6 { font-size: 0.9rem; color: var(--text-dim); margin-top: 1.5rem; margin-bottom: 0.5rem; font-weight: 600; }
        .blog-article-content p { margin-bottom: 1rem; }
        .blog-article-content pre { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; overflow-x: auto; margin-bottom: 1rem; }
        [data-theme="dark"] .blog-article-content pre { background: #1e293b; }
        [data-theme="light"] .blog-article-content pre { background: #e6ddd1; }
        .blog-article-content pre code { background: transparent; }
        .code-block { position: relative; margin-bottom: 1rem; }
        .code-block > pre { margin-bottom: 0; padding-top: 2.3rem; }
        .code-block-lang {
            position: absolute; top: 0.55rem; left: 0.75rem; z-index: 1;
            font-size: 0.7rem; line-height: 1.4; font-weight: 600;
            font-family: 'JetBrains Mono', 'SF Mono', monospace;
            color: var(--text-muted);
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.1rem 0.5rem;
            pointer-events: none;
        }
        .blog-article-content code { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 0.85rem; }
        .blog-article-content :not(pre) > code { background: var(--bg-secondary); padding: 0.15rem 0.4rem; border-radius: 3px; font-size: 0.85em; }
        .blog-article-content ul, .blog-article-content ol { padding-left: 1.5rem; margin-bottom: 1rem; }
        .blog-article-content li { margin-bottom: 0.4rem; }
        .blog-article-content li > ul, .blog-article-content li > ol { margin-top: 0.4rem; margin-bottom: 0; }
        .blog-article-content a { color: var(--primary); text-decoration: none; }
        .blog-article-content a:hover { text-decoration: underline; }
        .blog-article-content img { max-width: 100%; height: auto; border-radius: 8px; margin: 1rem 0; box-shadow: 0 2px 12px var(--shadow); }
        .blog-article-content mark { background: var(--primary-dim); color: var(--primary); padding: 0.1rem 0.3rem; border-radius: 3px; }
        .blog-article-content blockquote {
            border-left: 3px solid var(--primary); padding: 0.5rem 1rem;
            margin: 1rem 0; background: var(--primary-dim); border-radius: 0 6px 6px 0;
            color: var(--text-dim);
        }
        .blog-article-content blockquote p { margin-bottom: 0.5rem; }
        .blog-article-content blockquote p:last-child { margin-bottom: 0; }
        .blog-article-content table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.85rem; overflow-x: auto; display: block; }
        .blog-article-content th, .blog-article-content td { padding: 0.6rem 0.75rem; border: 1px solid var(--border); text-align: left; vertical-align: top; }
        .blog-article-content th { background: var(--bg-secondary); font-weight: 600; white-space: nowrap; }
        .blog-article-content tr:nth-child(even) { background: rgba(var(--bg-rgb), 0.5); }
        .blog-article-content hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }

        /* Prev/Next navigation */
        .blog-nav-posts { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border); }
        .blog-nav-post {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
            padding: 1rem 1.25rem; transition: border-color 0.3s, transform 0.3s;
            text-decoration: none; color: inherit; display: block;
        }
        .blog-nav-post:hover { border-color: var(--primary); transform: translateY(-1px); }
        .blog-nav-post-label { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 0.25rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .blog-nav-post-title { font-weight: 600; font-size: 0.9rem; }
        .blog-nav-post.next { text-align: right; }

        /* Floating action buttons */
        .fab-group {
            position: fixed; bottom: 2rem; right: 2rem; display: flex; flex-direction: column; gap: 0.5rem; z-index: 50;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .fab-group.visible { opacity: 1; pointer-events: auto; }
        .fab-btn {
            width: 40px; height: 40px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: border-color 0.3s, color 0.3s, background 0.3s;
            color: var(--text-dim); font-size: 1rem; text-decoration: none;
        }
        .fab-btn:hover { border-color: var(--primary); color: var(--primary); }
        .fab-btn.active { background: var(--primary-dim); border-color: var(--primary); color: var(--primary); }

        /* Mobile TOC overlay */
        @media (max-width: 768px) {
            .blog-article-layout { padding: 2rem 1.25rem; }
            .blog-toc {
                position: fixed; top: 0; left: 0; width: 75vw; max-width: 300px; height: 100vh;
                background: var(--bg-card); border-right: 1px solid var(--border);
                padding: 1.5rem 1rem; z-index: 200;
                transform: translateX(-100%); transition: transform 0.3s ease;
                overflow-y: auto;
            }
            body.toc-open .blog-toc { display: block; transform: translateX(0); }
            .blog-toc-overlay {
                display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
                z-index: 199;
            }
            body.toc-open .blog-toc-overlay { display: block; }
            .blog-nav-posts { grid-template-columns: 1fr; }
            h1 { font-size: 1.4rem; }
            table { font-size: 0.8rem; }
            th, td { padding: 0.4rem 0.5rem; }
        }
    </style>
</head>
<body>
    <nav class="blog-nav">
        <div class="blog-nav-left">
            <a href="../" class="logo" style="font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--primary);">&larr; cmixed</a>
            <a href="./" style="font-weight:600;font-size:0.95rem;color:var(--text);">博客</a>
        </div>
        <div style="display:flex;align-items:center;gap:1rem;">
            <a href="feed.xml" title="RSS 订阅" style="color:var(--text-muted);font-size:1.1rem;">&#9741;</a>
            <button class="fab-btn" id="indentToggle" title="首行缩进">&#8677;</button>
            <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
                <div class="theme-toggle-slider">
                    <span class="theme-icon moon-icon">&#9684;</span>
                    <span class="theme-icon sun-icon">&#9685;</span>
                </div>
            </button>
        </div>
    </nav>

    <div class="blog-article-layout">
        <div class="blog-toc-overlay" id="tocOverlay"></div>
        <aside class="blog-toc" id="blogToc">
            <div class="blog-toc-title">目录</div>
            <div class="blog-toc-links" id="tocLinks">{{toc}}</div>
        </aside>
        <article class="blog-article">
            <h1>{{title}}</h1>
            {{descriptionHtml}}
            <div class="blog-article-meta">
                <div class="blog-article-tags">{{tags}}</div>
                <div class="blog-article-info">阅读约 {{readTime}} 分钟 · 创建于 {{date}} · 更新于 {{updated}}</div>
            </div>
            <div class="blog-article-content">{{content}}</div>
            <div class="blog-nav-posts">{{prevNext}}</div>
        </article>
    </div>

    <div class="fab-group" id="fabGroup">
        <button class="fab-btn" id="tocToggle" title="目录">&#9776;</button>
        <a href="./" class="fab-btn" title="博客主页">&#9750;</a>
        <button class="fab-btn" id="backToTop" title="返回顶部">&uarr;</button>
        <button class="fab-btn" id="goBottom" title="直达底部">&darr;</button>
    </div>

    <script>
        (function() {
            var htmlEl = document.documentElement;
            var saved = localStorage.getItem('theme');
            if (saved) htmlEl.setAttribute('data-theme', saved);
            else if (!window.matchMedia('(prefers-color-scheme: dark)').matches) htmlEl.setAttribute('data-theme', 'light');

            var hljsLink = document.getElementById('hljs-theme');
            function updateHljsTheme(t) {
                hljsLink.href = t === 'dark'
                    ? 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css'
                    : 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css';
            }
            updateHljsTheme(htmlEl.getAttribute('data-theme'));

            document.getElementById('themeToggle').addEventListener('click', function() {
                var t = htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                htmlEl.setAttribute('data-theme', t);
                localStorage.setItem('theme', t);
                updateHljsTheme(t);
            });

            // Indent toggle
            var indentBtn = document.getElementById('indentToggle');
            var content = document.querySelector('.blog-article-content');
            var savedIndent = localStorage.getItem('indent');
            if (savedIndent === 'true') { document.body.classList.add('indent'); indentBtn.classList.add('active'); }
            indentBtn.addEventListener('click', function() {
                if (!content) return;
                document.body.classList.toggle('indent');
                indentBtn.classList.toggle('active', document.body.classList.contains('indent'));
                localStorage.setItem('indent', document.body.classList.contains('indent'));
            });

            // Conditional syntax highlighting (~43KB saved when no code blocks)
            var codeBlocks = document.querySelectorAll('pre code');
            if (codeBlocks.length > 0) {
                var script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js';
                script.onload = function() {
                    codeBlocks.forEach(function(block) { hljs.highlightElement(block); });
                };
                document.head.appendChild(script);
            }

            // Code block language badge (top-left)
            document.querySelectorAll('.blog-article-content pre').forEach(function(pre) {
                if (pre.parentNode.classList.contains('code-block')) return;
                var code = pre.querySelector('code');
                if (!code) return;
                var match = (code.className || '').match(/language-(\S+)/);
                if (!match) return;
                var lang = match[1];
                var wrapper = document.createElement('div');
                wrapper.className = 'code-block';
                pre.parentNode.insertBefore(wrapper, pre);
                wrapper.appendChild(pre);
                var badge = document.createElement('span');
                badge.className = 'code-block-lang';
                badge.textContent = lang;
                wrapper.appendChild(badge);
            });

            // TOC: arrow click to collapse/expand (supports nested groups)
            function updateAncestorHeights(el) {
                var parent = el.parentElement;
                while (parent) {
                    if (parent.classList && parent.classList.contains('toc-children') && !parent.parentElement.classList.contains('collapsed')) {
                        parent.style.maxHeight = parent.scrollHeight + 'px';
                    }
                    parent = parent.parentElement;
                }
            }
            document.querySelectorAll('.toc-group').forEach(function(group) {
                var children = group.querySelector(':scope > .toc-children');
                var arrow = group.querySelector(':scope > .toc-item > .toc-arrow');
                if (children && arrow) {
                    children.style.maxHeight = group.classList.contains('collapsed') ? '0px' : children.scrollHeight + 'px';
                    arrow.addEventListener('click', function(e) {
                        e.stopPropagation();
                        var wasCollapsed = group.classList.contains('collapsed');
                        if (wasCollapsed) {
                            // Expand: measure content height BEFORE removing collapsed
                            var h = children.scrollHeight;
                            group.classList.remove('collapsed');
                            children.style.maxHeight = h + 'px';
                        } else {
                            // Collapse: CSS rule handles max-height: 0, just add class
                            group.classList.add('collapsed');
                            children.style.maxHeight = '0px';
                        }
                        updateAncestorHeights(children);
                    });
                }
            });

            // TOC scroll tracking with O(1) lookup (skip links inside collapsed groups)
            var links = document.querySelectorAll('#tocLinks a');
            var linkMap = {};
            links.forEach(function(a) { linkMap[a.getAttribute('href').slice(1)] = a; });
            var ids = Object.keys(linkMap);
            var observer = new IntersectionObserver(function(entries) {
                entries.forEach(function(entry) {
                    if (entry.isIntersecting) {
                        links.forEach(function(l) { l.classList.remove('active'); });
                        var link = linkMap[entry.target.id];
                        if (link && !link.closest('.toc-group.collapsed')) {
                            link.classList.add('active');
                        }
                    }
                });
            }, { rootMargin: '-80px 0px -70% 0px' });
            ids.forEach(function(id) { var el = document.getElementById(id); if (el) observer.observe(el); });

            // Floating buttons
            var fabGroup = document.getElementById('fabGroup');
            window.addEventListener('scroll', function() {
                fabGroup.classList.toggle('visible', window.scrollY > 400);
            }, { passive: true });
            document.getElementById('backToTop').addEventListener('click', function() { window.scrollTo({ top: 0, behavior: 'smooth' }); });
            document.getElementById('goBottom').addEventListener('click', function() { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); });

            // TOC toggle
            var tocBtn = document.getElementById('tocToggle');
            var tocOverlay = document.getElementById('tocOverlay');
            tocBtn.addEventListener('click', function() {
                document.body.classList.toggle('toc-open');
                tocBtn.classList.toggle('active', document.body.classList.contains('toc-open'));
            });
            tocOverlay.addEventListener('click', function() {
                document.body.classList.remove('toc-open');
                tocBtn.classList.remove('active');
            });
            // Close mobile TOC when clicking a link
            document.querySelectorAll('#tocLinks a').forEach(function(a) {
                a.addEventListener('click', function() {
                    if (window.innerWidth <= 768) {
                        document.body.classList.remove('toc-open');
                        tocBtn.classList.remove('active');
                    }
                });
            });
        })();
    </script>
</body>
</html>
