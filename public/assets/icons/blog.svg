<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="个人博客">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#183b3d"/>
      <stop offset="1" stop-color="#0d2023"/>
    </linearGradient>
  </defs>
  <!-- 与主页 / 小窝共用同一块墨底、受光边与青线笔画 -->
