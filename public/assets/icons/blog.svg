    <path d="M9.4 6.8h11.2l4 4v14.4H9.4Z"/>
    <path d="M20.6 6.8v4h4"/>
  </g>
  <g fill="none" stroke="#7fe3cc" stroke-opacity=".82" stroke-width="1.6" stroke-linecap="round">
    <path d="M12.8 14.6h8.8M12.8 18.7h8.8M12.8 22.8h5.6"/>
