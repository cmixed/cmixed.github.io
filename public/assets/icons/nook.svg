<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="资源小窝">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#183b3d"/>
      <stop offset="1" stop-color="#0d2023"/>
    </linearGradient>
  </defs>
  <!-- 与主页 / 博客共用同一块墨底、受光边与青线笔画 -->
  <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#ink)" stroke="#5fd1b5" stroke-opacity=".45"/>
  <!-- 资源小窝：规整等距收纳盒，顶面 + 两侧 + 中棱，缩到 16px 仍是个盒子 -->
  <g fill="none" stroke="#7fe3cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 6.6 25 11.4 16 16.2 7 11.4Z"/>
    <path d="M7 11.4v9.4L16 25.6l9-4.8v-9.4"/>
    <path d="M16 16.2v9.4"/>
  </g>
