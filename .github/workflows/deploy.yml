name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - run: vp check
      - run: vp test

  build:
    runs-on: ubuntu-26.04
    env:
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - run: vp run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    needs: [check, build]
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
