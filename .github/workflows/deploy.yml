name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - run: vp check
      - run: vp test

  build:
    runs-on: ubuntu-26.04
    env:
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - run: vp run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    needs: [check, build]
    # 队列偶尔会排很久，超时比无限挂着好排查
    timeout-minutes: 15
    # deploy-pages 的依赖链里还有包在 require Node 内置的 punycode，
    # 于是每次部署都打一遍 DEP0040 弃用告警。那是 action 自己的依赖，
    # 项目这边改不到；这里只关掉弃用告警的输出，不影响部署行为。
    # 等 action 更新掉这条依赖后可以删掉。
    env:
      NODE_OPTIONS: --no-deprecation
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
