name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - name: Check line endings
        run: |
          bad=$(git ls-files --eol | grep -E 'i/(crlf|mixed)|w/(crlf|mixed)' || true)
          if [ -n "$bad" ]; then
            echo "::error::CRLF line endings found in text files"
            echo "$bad"
            exit 1
          fi
      - run: vp check
      - run: vp test

  build:
    runs-on: ubuntu-26.04
    env:
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    # 只有这一步需要写 issue（季度总结提醒）；deploy 仍走顶层的 pages 权限
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - run: vp run build
      # 季度总结：构建期已自动判断过（site-meta.ts 的 quarterSummaryGaps），
      # 这里只是把结果接出来 —— 注解 + Step Summary + outputs，供下一步决定要不要提醒。
      - name: 季度总结检查
        id: quarter
        run: pnpm run quarter-summary -- --ci
      # 需要补写时开（或更新）一个固定标题的 issue；补写完自动关掉。
      # 只是提醒，失败不阻塞部署。
      - name: 提醒补写季度总结
        if: steps.quarter.outputs.needs_attention == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const title = '季度总结待补写';
            const missing = '${{ steps.quarter.outputs.missing }}'.split(',').filter(Boolean);
            const changed = '${{ steps.quarter.outputs.changed }}'.split(',').filter(Boolean);
            const rows = [
              ...missing.map((q) => `| ${q} | 待补写 |`),
              ...changed.map((q) => `| ${q} | 指纹变化，请复核 |`),
            ];
            const body = [
              '构建时自动检查发现，已完结季度的总结需要动笔：',
              '',
              '| 季度 | 状态 |',
              '| --- | --- |',
              ...rows,
              '',
              '补写入口：`pnpm quarter-summary`（打印素材与指纹），',
              '手写一条后连同 `fingerprint` 一起提交 `src/data/quarter-summaries.json`。',
              '构建期只读不生成，所以同一季度不会被重复总结。',
              '',
              `触发：${context.workflow} · ${context.sha.slice(0, 7)}`,
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 50,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
      - name: 总结补齐后关闭提醒
        if: steps.quarter.outputs.needs_attention == 'false'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const title = '季度总结待补写';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 50,
            });
            for (const issue of issues.filter((i) => !i.pull_request && i.title === title)) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    needs: [check, build]
    # 队列偶尔会排很久，超时比无限挂着好排查
    timeout-minutes: 15
    # deploy-pages 的依赖链里还有包在 require Node 内置的 punycode，
    # 于是每次部署都打一遍 DEP0040 弃用告警。那是 action 自己的依赖，
    # 项目这边改不到；这里只关掉弃用告警的输出，不影响部署行为。
    # 等 action 更新掉这条依赖后可以删掉。
    env:
      NODE_OPTIONS: --no-deprecation
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
