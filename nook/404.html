<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <script>
        var t = localStorage.getItem('theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
        else if (!window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'light');
    </script>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>404 · 资源小窝 | cmixed</title>
    <link rel="stylesheet" href="style.css">
    <style>body{padding-top:0;display:flex;align-items:center;justify-content:center;min-height:80vh}
    .e404{text-align:center}.e404 h1{font-size:5rem;color:var(--primary);margin-bottom:.5rem}
    .e404 p{color:var(--text-dim);margin-bottom:1.5rem}</style>
</head>
<body>
    <div class="e404"><h1>404</h1><p>资源不存在或已被移除</p><a href="../" class="btn">返回首页</a></div>
</body>
</html>
