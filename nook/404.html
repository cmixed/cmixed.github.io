<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <script src="/theme.js"></script>
    <script defer src="/cursor.js"></script>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>404 · 资源小窝 | cmixed</title>
    <link rel="stylesheet" href="/nook/style.css">
    <style>
        /* 导航 + 居中面板：导航与全站同规格（见 style.css「SHARED NAV STYLES」）。
           本页会被 /nook/** 下的任意 404 命中，所以资源与链接一律用根路径（/…），
           不依赖当前 URL 的层级。 */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            transition: background 0.3s, color 0.3s;
        }
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .e404 {
            text-align: center; max-width: 420px; width: 100%;
            /* 底色与 6 层受光图由 style.css 统一给；这里不要写 background 简写 */
            border: 1px solid var(--border);
            border-radius: 16px; padding: 3.5rem 2.5rem;
            box-shadow: var(--mica-elev-1);
            transition: background-color var(--transition-speed), border-color var(--transition-speed), box-shadow var(--transition-speed), --glare 0.28s ease;
        }
        .e404 h1 { font-size: 5rem; color: var(--primary-text); margin-bottom: .5rem; }
        .e404 p { color: var(--text-dim); margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    <nav class="nook-nav">
        <div class="nook-nav-left">
            <a href="/" class="logo">&larr; cmixed</a>
            <a href="/blog/" class="nook-nav-title">博客</a>
            <a href="/nook/" class="nook-nav-title">资源小窝</a>
        </div>
        <div class="nook-nav-right">
            <a href="/nook/feed.xml" title="RSS 订阅" class="nook-nav-rss">&#9741;</a>
            <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
                <div class="theme-toggle-slider">
                    <span class="theme-icon moon-icon">&#9684;</span>
                    <span class="theme-icon sun-icon">&#9685;</span>
                </div>
            </button>
        </div>
    </nav>

    <main>
        <div class="e404"><h1>404</h1><p>资源不存在或已被移除</p><a href="/" class="btn">返回首页</a></div>
    </main>

    <script>
        document.getElementById('themeToggle').addEventListener('click', function () {
            window.toggleTheme();
        });
    </script>
</body>
</html>
