<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <script src="../theme.js"></script>
    <script defer src="../cursor.js"></script>
    <script defer src="../fab.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="cmixed 的资源小窝 - 工具、文档与代码资源下载">
    <meta name="color-scheme" content="dark light">
    <meta property="og:title" content="资源小窝 · cmixed">
    <meta property="og:description" content="实用工具、文档与代码资源">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cmixed.github.io/nook/">
    <meta property="og:image" content="https://cmixed.github.io/assets/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="cmixed 资源小窝">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="资源小窝 · cmixed">
    <meta name="twitter:description" content="实用工具、文档与代码资源">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/nook-32x32.png">
    <link rel="icon" type="image/png" href="../assets/icons/nook-192x192.png">
    <link rel="apple-touch-icon" href="../assets/icons/nook-192x192.png">
    <link rel="stylesheet" href="style.css">
    <link rel="alternate" type="application/rss+xml" title="cmixed 资源小窝 RSS" href="feed.xml">
    <title>资源小窝 · cmixed</title>
    <style>
        body { transition: background 0.3s, color 0.3s; min-height: 100vh; min-height: 100dvh; }

        .scroll-progress {
            position: fixed; top: 0; left: 0; height: 2px; width: 100%;
            background: var(--primary); z-index: 200;
            transform-origin: left; transform: scaleX(0);
            will-change: transform; transition: transform 0.1s linear, background var(--transition-speed);
        }

        /* 筛选标签的材质与尺寸在 style.css 的「小标签」规则里统一（胶囊 + 实心选中） */

        .nook-page { max-width: 800px; margin: 0 auto; padding: 3rem 2rem; }
        .nook-page h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; }
        .nook-page-sub { color: var(--text-dim); margin-bottom: 2.5rem; }
        .nook-filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 2rem; }
        .nook-grid { display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }

        .nook-card {
            /* 底色与 6 层受光图由 style.css 统一给；这里不要写 background 简写 */
            border: 1px solid var(--border); border-radius: 12px;
            padding: 1.5rem; position: relative; display: flex; flex-direction: column;
            text-decoration: none; color: inherit; overflow: hidden;
            transition: background-color var(--transition-speed), border-color 0.3s, transform 0.3s, box-shadow 0.3s, --glare 0.28s ease;
            box-shadow: var(--mica-elev-1);
            content-visibility: auto; contain-intrinsic-size: auto 200px;
        }
        .nook-card.fade-in-item { opacity: 0; transform: translateY(12px); }
        .nook-card.fade-in-item.visible { opacity: 1; transform: translateY(0); }
        .nook-card::before {
            content: ''; position: absolute; top: 0; left: 0;
            width: 100%; height: 2px; background: var(--primary);
            transform: scaleX(0); transform-origin: left; transition: transform 0.3s, height 0.3s;
        }
        .nook-card:hover { border-color: var(--primary); transform: translateY(-4px); box-shadow: var(--mica-elev-2); }
        /* .visible 的权重比 :hover 高，会把上面的 hover 抬升顶掉（列表卡片悬停不动）；补一条更高权重的 */
        .nook-card.fade-in-item.visible:hover { transform: translateY(-4px); }
        .nook-card:hover::before { transform: scaleX(1); height: 4px; opacity: 1; }

        .nook-card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 0.75rem; }
        .nook-card-title { font-weight: 700; font-size: 1.1rem; color: var(--text); }
        .nook-card-category {
            display: inline-flex; align-items: center; gap: 0.3rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .nook-card-desc { color: var(--text-dim); font-size: 0.85rem; line-height: 1.6; margin-bottom: 1rem; }
        .nook-card-footer { margin-top: auto; }
        .nook-card-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .nook-card-meta { display: flex; justify-content: space-between; align-items: center; }
        .nook-card-info { font-size: 0.8rem; color: var(--text-muted); }
        .nook-download {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.5rem 1rem; background: var(--primary); color: #fff;
            border: none; border-radius: 6px; font-size: 0.8rem; font-weight: 500;
            cursor: pointer; transition: background 0.3s, transform 0.3s, color 0.3s;
        }
        .nook-download:hover { background: transparent; color: var(--primary-text); transform: translateY(-1px); }
        .nook-card-pin { border-color: var(--primary-dim); }
        .nook-card-pin::before { transform: scaleX(1); height: 2px; opacity: 0.3; }
        .nook-btn-website { background: var(--mica-raised); color: var(--primary-text); border: 1px solid var(--primary); }
        .nook-btn-website:hover { background: var(--primary); color: #fff; }

        .nook-empty { text-align: center; padding: 4rem 2rem; color: var(--text-dim); }
        .nook-empty-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }

        @media (max-width: 768px) {
            .nook-page { padding: 2rem 1.25rem; }
            .nook-page h1 { font-size: 1.4rem; }
            .nook-card { padding: 1.25rem; }
        }
        @media (max-width: 480px) {
            .nook-page { padding: 1.5rem 1rem; }
            .nook-page h1 { font-size: 1.25rem; }
            .nook-page-sub { font-size: 0.85rem; }
            .nook-card-title { font-size: 1rem; }
            .nook-card-desc { font-size: 0.8rem; }
        }
        @media (max-width: 360px) {
            .nook-page h1 { font-size: 1.15rem; }
            .nook-card-title { font-size: 0.95rem; }
        }
        @media (min-width: 1024px) {
            .nook-page { max-width: 1000px; }
        }
        @media (min-width: 1280px) { .nook-page { max-width: 1120px; } }
        @media (min-width: 1536px) { .nook-page { max-width: 1280px; } }
        @media (min-width: 1920px) {
            .nook-page { max-width: 1400px; padding: 4rem 3rem; }
            .nook-card { padding: 2rem; }
            .nook-card-title { font-size: 1.2rem; }
        }
        @media (min-width: 2560px) {
            .nook-page { max-width: 1500px; padding: 5rem 4rem; }
            .nook-grid { gap: 1.5rem; }
            .nook-card { padding: 2.5rem; }
            .nook-card-title { font-size: 1.3rem; }
            .nook-card-desc { font-size: 0.95rem; }
        }

        @media (hover: none) and (pointer: coarse) {
            .nook-card:hover { transform: none; }
            .nook-download { min-height: 44px; padding: 0.6rem 1.2rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: 0.01ms !important; }
        }

        @media print {
            .nook-filters, .nook-download { display: none !important; }
            body { background: white !important; color: black !important; }
            .nook-card { break-inside: avoid; box-shadow: none; border: 1px solid #ccc; }
        }
    </style>
</head>
<body>
    <div class="scroll-progress" id="scrollProgress"></div>
    <nav class="nook-nav">
        <div class="nook-nav-left">
            <a href="../" class="logo">&larr; cmixed</a>
            <a href="../blog/" class="nook-nav-title">博客</a>
            <a href="./" class="nook-nav-title nook-nav-active">资源小窝</a>
        </div>
        <div class="nook-nav-right">
            <a href="feed.xml" title="RSS 订阅" class="nook-nav-rss">&#9741;</a>
            <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
                <div class="theme-toggle-slider">
                    <span class="theme-icon moon-icon">&#9684;</span>
                    <span class="theme-icon sun-icon">&#9685;</span>
                </div>
            </button>
        </div>
    </nav>

    <div class="nook-page">
        <h1>资源小窝</h1>
        <p class="nook-page-sub">实用工具、文档与代码资源</p>
        <div class="search-bar">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input id="searchInput" class="search-input" type="search" autocomplete="off" spellcheck="false" placeholder="搜索标题、摘要或标签…" aria-label="搜索资源">
            <button type="button" id="searchClear" class="search-clear" aria-label="清除搜索" hidden>&times;</button>
        </div>
        <p class="search-count" id="searchCount" role="status" aria-live="polite" hidden></p>
        <div class="nook-filters">{{filters}}</div>
        <div class="nook-grid">{{resources}}</div>
        <div class="search-empty" id="searchEmpty" hidden>
            <div class="search-empty-icon">&#128269;</div>
            <p>没有找到匹配的资源</p>
        </div>
    </div>

    <script src="../search.js"></script>
    <script>
        (function() {
            document.getElementById('themeToggle').addEventListener('click', function() {
                window.toggleTheme();
            });

            var progressBar = document.getElementById('scrollProgress');
            if (progressBar) {
                window.addEventListener('scroll', function() {
                    var scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
                    var scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                    var progress = scrollHeight > 0 ? scrollTop / scrollHeight : 0;
                    progressBar.style.transform = 'scaleX(' + progress + ')';
                }, { passive: true });
            }

            var cards = Array.from(document.querySelectorAll('.nook-card'));
            var categoryByCard = new Map();
            cards.forEach(function(card) {
                categoryByCard.set(card, card.getAttribute('data-category'));
            });

            if ('IntersectionObserver' in window) {
                var fadeObserver = new IntersectionObserver(function(entries) {
                    entries.forEach(function(entry) {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                            fadeObserver.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.1 });
                cards.forEach(function(card) {
                    card.classList.add('fade-in-item');
                    fadeObserver.observe(card);
                });
            }

            var params = new URLSearchParams(location.search);
            var activeFilter = params.get('category') || '';

            function applyFilterButtons() {
                document.querySelectorAll('.nook-filter').forEach(function(btn) {
                    btn.classList.toggle('active', (btn.getAttribute('data-category') || '') === activeFilter);
                });
            }

            // 只改自己的 URL 参数，保留 ?q= 等其它参数
            function syncUrl() {
                var p = new URLSearchParams(location.search);
                if (activeFilter) p.set('category', activeFilter); else p.delete('category');
                var qs = p.toString();
                history.pushState(null, '', location.pathname + (qs ? '?' + qs : ''));
            }

            var search = window.initListSearch({
                inputId: 'searchInput',
                clearId: 'searchClear',
                countId: 'searchCount',
                emptyId: 'searchEmpty',
                cardSelector: '.nook-card',
                countUnit: '个资源',
                extraFilter: function(card) {
                    return !activeFilter || categoryByCard.get(card) === activeFilter;
                }
            });

            document.querySelectorAll('.nook-filter').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    var cat = btn.getAttribute('data-category') || '';
                    activeFilter = activeFilter === cat ? '' : cat;
                    applyFilterButtons();
                    syncUrl();
                    search.refresh();
                });
            });
            applyFilterButtons();

            window.addEventListener('popstate', function() {
                activeFilter = new URLSearchParams(location.search).get('category') || '';
                applyFilterButtons();
                search.refresh();
            });
        })();
    </script>
</body>
</html>
