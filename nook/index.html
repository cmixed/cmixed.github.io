<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <script src="../theme.js"></script>
    <script defer src="../ui.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="cmixed 的资源小窝 - 工具、文档与代码资源下载">
    <meta name="color-scheme" content="dark light">
    <meta property="og:title" content="资源小窝 · cmixed">
    <meta property="og:description" content="实用工具、文档与代码资源">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cmixed.github.io/nook/">
    <meta property="og:image" content="https://cmixed.github.io/assets/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="cmixed 资源小窝">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="资源小窝 · cmixed">
    <meta name="twitter:description" content="实用工具、文档与代码资源">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/nook-32x32.png">
    <link rel="apple-touch-icon" href="../assets/icons/nook-192x192.png">
    <link rel="stylesheet" href="style.css">
    <link rel="alternate" type="application/rss+xml" title="cmixed 资源小窝 RSS" href="feed.xml">
    <title>资源小窝 · cmixed</title>
    <style>
        body { transition: background 0.3s, color 0.3s; min-height: 100vh; min-height: 100dvh; }

        .scroll-progress {
            position: fixed; top: 0; left: 0; height: 2px; width: 100%;
            background: var(--primary); z-index: 200;
            transform-origin: left; transform: scaleX(0);
            will-change: transform; transition: transform 0.1s linear, background var(--transition-speed);
        }

        /* 头部（标题 / 小字 / 排序）与筛选标签栏的尺寸、材质、间距都在 style.css 的
           「列表页头部」「小标签」两节里，博客与资源小窝共用同一份。 */

        .nook-page { --list-max: 800px; max-width: var(--list-max); margin: 0 auto; padding: 3rem 2rem; }
        /* 250px 一档：1120px 内容宽（减去左右 padding 后 1056）正好排 4 列 —— 原来 320px 只能排 3 列，
           卡片显得空、留白多。卡片内容是「标题 2 行 + 摘要 3 行 + 标签 + 元信息」，
           250px 够放。grid-auto-rows: 1fr 让同一页所有卡片等高。 */
        .nook-grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr));
            grid-auto-rows: 1fr;
        }

        .nook-card {
            /* 底色与 6 层受光图由 style.css 统一给；这里不要写 background 简写 */
            border: 1px solid var(--border); border-radius: 12px;
            padding: 1.25rem; position: relative; display: flex; flex-direction: column;
            text-decoration: none; color: inherit; overflow: visible; height: 100%;
            transition: background-color var(--transition-speed), border-color 0.3s, transform 0.3s, box-shadow 0.3s, --glare 0.28s ease;
            box-shadow: var(--mica-elev-1);
        }
        .nook-card.fade-in-item { opacity: 0; transform: translateY(12px); }
        .nook-card.fade-in-item.visible { opacity: 1; transform: translateY(0); }
        .nook-card::before {
            content: ''; position: absolute; top: 0; left: 0;
            width: 100%; height: 2px; background: var(--primary);
            transform: scaleX(0); transform-origin: left; transition: transform 0.3s, height 0.3s;
        }
        .nook-card:hover { border-color: var(--primary); transform: translateY(-4px); box-shadow: var(--mica-elev-2); z-index: 20; }
        .nook-card:focus-visible { z-index: 20; }
        /* .visible 的权重比 :hover 高，会把上面的 hover 抬升顶掉（列表卡片悬停不动）；补一条更高权重的 */
        .nook-card.fade-in-item.visible:hover { transform: translateY(-4px); }
        .nook-card:hover::before { transform: scaleX(1); height: 4px; opacity: 1; }

        .nook-card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 0.75rem; }
        .nook-card-title {
            font-weight: 700; font-size: 1.1rem; color: var(--text);
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .nook-card-category {
            display: inline-flex; align-items: center; gap: 0.3rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .nook-card-desc {
            color: var(--text-dim); font-size: 0.85rem; line-height: 1.6; margin-bottom: 1rem;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
            overflow: hidden;
            /* 固定三行高：与博客列表同一套，摘要短的卡不再留洞 */
            min-height: calc(3 * 1.6 * 0.85rem);
        }
        .nook-card-footer { margin-top: auto; }
        .nook-card-tags {
            display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1rem;
            max-height: 3.9rem; overflow: hidden;
        }
        .nook-card-meta { display: flex; justify-content: space-between; align-items: center; }
        .nook-card-info { font-size: 0.8rem; color: var(--text-muted); }

        /* 浮窗样式统一在 style.css 的「卡片浮窗」一节（博客与资源小窝共用），
           这里不再各自维护一份；只有正文真的被 line-clamp 截断时才会出现。 */

        .nook-download {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.5rem 1rem; background: var(--primary); color: #fff;
            border: none; border-radius: 6px; font-size: 0.8rem; font-weight: 500;
            cursor: pointer; transition: background 0.3s, transform 0.3s, color 0.3s;
        }
        .nook-download:hover { background: transparent; color: var(--primary-text); transform: translateY(-1px); }
        .nook-card-pin { border-color: var(--primary-dim); }
        .nook-card-pin::before { transform: scaleX(1); height: 2px; opacity: 0.3; }
        .nook-btn-website { background: var(--mica-raised); color: var(--primary-text); border: 1px solid var(--primary); }
        .nook-btn-website:hover { background: var(--primary); color: #fff; }

        .nook-empty { text-align: center; padding: 4rem 2rem; color: var(--text-dim); }
        .nook-empty-icon { display: flex; justify-content: center; margin-bottom: 1rem; opacity: 0.5; }
        .nook-empty-icon svg { width: 48px; height: 48px; }

        @media (max-width: 768px) {
            .nook-page { padding: 2rem 1.25rem; }
            .nook-card { padding: 1.25rem; }
        }
        @media (max-width: 480px) {
            .nook-page { padding: 1.5rem 1rem; }
            .nook-card-title { font-size: 1rem; }
            .nook-card-desc { font-size: 0.8rem; }
        }
        @media (max-width: 360px) {
            .nook-card-title { font-size: 0.95rem; }
        }
        @media (min-width: 1024px) {
            .nook-page { --list-max: 1000px; }
        }
        @media (min-width: 1280px) { .nook-page { --list-max: 1120px; } }
        @media (min-width: 1536px) { .nook-page { --list-max: 1280px; } }
        @media (min-width: 1920px) {
            .nook-page { --list-max: 1400px; padding: 4rem 3rem; }
            .nook-card { padding: 2rem; }
            .nook-card-title { font-size: 1.2rem; }
        }
        @media (min-width: 2560px) {
            .nook-page { --list-max: 1500px; padding: 5rem 4rem; }
            .nook-grid { gap: 1.5rem; }
            .nook-card { padding: 2.5rem; }
            .nook-card-title { font-size: 1.3rem; }
            .nook-card-desc { font-size: 0.95rem; }
        }

        @media (hover: none) and (pointer: coarse) {
            .nook-card:hover { transform: none; }
            .nook-download { min-height: 44px; padding: 0.6rem 1.2rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: 0.01ms !important; }
        }

        @media print {
            .list-sort, .list-filters, .nook-download { display: none !important; }
            body { background: white !important; color: black !important; }
            .nook-card { break-inside: avoid; box-shadow: none; border: 1px solid #ccc; }
        }
    </style>
    <script>
        /* 桌面默认展开筛选栏。放在首帧前加 class，避免页面先按窄版排一遍再跳宽。 */
        (function () {
            try {
                var saved = localStorage.getItem('list-filters-open');
                if (window.matchMedia('(min-width: 1280px)').matches && saved !== 'false') {
                    document.documentElement.classList.add('filters-open');
                }
            } catch (e) { }
        })();
    </script>
</head>
<body>
    <div class="scroll-progress" id="scrollProgress"></div>
    <nav class="nook-nav">
        <div class="nook-nav-left">
            <a href="../" class="logo">cmixed &larr;</a>
            <a href="../blog/" class="nook-nav-title">个人博客</a>
            <a href="./" class="nook-nav-title nook-nav-active">资源小窝</a>
        </div>

        <div class="nav-search" id="navSearch" role="search">
            <div class="search-bar">
                {{icon:search:search-icon}}
                <input id="searchInput" class="search-input" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search" placeholder="搜索标题、摘要或标签…" aria-label="搜索资源">
                <button type="button" id="searchClear" class="search-clear" aria-label="清除搜索" hidden>&times;</button>
            </div>
            <button type="button" class="nav-search-cancel" id="searchCancel">取消</button>
        </div>

        <div class="nook-nav-right">
            <a href="feed.xml" title="RSS 订阅" class="nook-nav-rss">{{icon:rss}}</a>
            <button class="fab-btn" id="searchToggle" type="button" title="搜索" aria-label="搜索资源" aria-expanded="false" aria-controls="navSearch">{{icon:search}}</button>
            <button class="fab-btn" id="filterToggle" type="button" title="分类" aria-label="筛选分类" aria-expanded="false" aria-controls="filterPanel">
                {{icon:tag}}
            </button>
            <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
                <div class="theme-toggle-slider">
                    <span class="theme-icon moon-icon">{{icon:moon}}</span>
                    <span class="theme-icon sun-icon">{{icon:sun}}</span>
                </div>
            </button>
        </div>
    </nav>

    <div class="list-filters-overlay" id="filterOverlay"></div>

    <div class="nook-page list-page">
        <div class="list-layout" id="listLayout">
            <div class="list-main">
                <div class="list-head">
                    <h1 class="list-title">资源小窝</h1>
                    <div class="list-meta">
                        <p class="list-sub">实用工具、文档与代码资源</p>
                        <div class="list-sort" role="group" aria-label="排序方式">
                            <span class="list-sort-label" aria-hidden="true">排序</span>
                            <button type="button" class="list-sort-btn" data-sort="default" aria-pressed="true">默认</button>
                            <button type="button" class="list-sort-btn" data-sort="date" aria-pressed="false">创建时间</button>
                            <button type="button" class="list-sort-btn" data-sort="updated" aria-pressed="false">更新时间</button>
                        </div>
                    </div>
                </div>
                <div class="search-count" id="searchCount" role="status" aria-live="polite" hidden></div>
                <div class="nook-grid">{{resources}}</div>
                <div class="search-empty" id="searchEmpty" hidden>
                    <div class="search-empty-icon">{{icon:search}}</div>
                    <p>没有找到匹配的资源</p>
                </div>
            </div>

            <aside class="list-filters-panel" id="filterPanel" aria-label="分类筛选">
                <div class="list-filters-head">
                    <span class="list-filters-title">分类</span>
                    <button type="button" class="list-filters-close" id="filterClose" aria-label="关闭筛选">&times;</button>
                </div>
                <div class="list-filters-scroll" id="filterScroll">
                    <div class="list-filters">{{filters}}</div>
                </div>
            </aside>
        </div>
    </div>

    <script src="../list.js"></script>
    <script>
        (function() {
            document.getElementById('themeToggle').addEventListener('click', function() {
                window.toggleTheme();
            });

            var progressBar = document.getElementById('scrollProgress');
            if (progressBar) {
                window.addEventListener('scroll', function() {
                    var scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
                    var scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                    var progress = scrollHeight > 0 ? scrollTop / scrollHeight : 0;
                    progressBar.style.transform = 'scaleX(' + progress + ')';
                }, { passive: true });
            }

            var cards = Array.from(document.querySelectorAll('.nook-card'));
            var categoryByCard = new Map();
            cards.forEach(function(card) {
                categoryByCard.set(card, card.getAttribute('data-category'));
            });

            if ('IntersectionObserver' in window) {
                var fadeObserver = new IntersectionObserver(function(entries) {
                    entries.forEach(function(entry) {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                            fadeObserver.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.1 });
                cards.forEach(function(card) {
                    card.classList.add('fade-in-item');
                    fadeObserver.observe(card);
                });
            }

            var params = new URLSearchParams(location.search);
            var activeFilter = params.get('category') || '';
            var filterToggle = document.getElementById('filterToggle');

            function applyFilterButtons() {
                document.querySelectorAll('.list-chip').forEach(function(btn) {
                    btn.classList.toggle('active', (btn.getAttribute('data-category') || '') === activeFilter);
                });
                if (filterToggle) filterToggle.toggleAttribute('data-filtered', !!activeFilter);
            }

            // 只改自己的 URL 参数，保留 ?q= / ?sort= 等其它参数
            function syncUrl() {
                var p = new URLSearchParams(location.search);
                if (activeFilter) p.set('category', activeFilter); else p.delete('category');
                var qs = p.toString();
                history.pushState(null, '', location.pathname + (qs ? '?' + qs : ''));
            }

            var search = window.initListSearch({
                inputId: 'searchInput',
                clearId: 'searchClear',
                countId: 'searchCount',
                emptyId: 'searchEmpty',
                toggleId: 'searchToggle',
                panelId: 'navSearch',
                cancelId: 'searchCancel',
                cardSelector: '.nook-card',
                countUnit: '个资源',
                extraFilter: function(card) {
                    return !activeFilter || categoryByCard.get(card) === activeFilter;
                }
            });

            document.querySelectorAll('.list-chip').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    var cat = btn.getAttribute('data-category') || '';
                    activeFilter = activeFilter === cat ? '' : cat;
                    applyFilterButtons();
                    syncUrl();
                    search.refresh();
                });
            });
            applyFilterButtons();

            // 排序（默认 / 创建时间 / 更新时间）由 list.js（search + sort）统一处理，两个列表页共用一份
            window.initListSort({
                list: '.nook-grid',
                card: '.nook-card',
                button: '.list-sort-btn',
                onChange: function() { search.refresh(); }
            });

            // 前进 / 后退：分类由本页同步；排序由 list.js 自己监听
            window.addEventListener('popstate', function() {
                activeFilter = new URLSearchParams(location.search).get('category') || '';
                applyFilterButtons();
                search.refresh();
            });

            window.initFilterPanel();
            window.initCardPopover();
        })();
    </script>
</body>
</html>
